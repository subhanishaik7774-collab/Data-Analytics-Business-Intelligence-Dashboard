name: Deploy React Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          cd client
          npm install
          npm run build
        env:
          # This injects the live URL of your backend API into the Vite build.
          # You should replace this URL with your actual deployed Render/Railway backend URL once it's up!
          VITE_API_URL: https://bi-dashboard-api-9me8.onrender.com

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/dist
          branch: gh-pages
